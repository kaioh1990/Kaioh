; Castlevania Fighter Online settings
; Lobby server used by Online > Lobby (leave empty to disable the lobby)
LobbyURL = https://cvf-lobby.onrender.com
; Players only see rooms from the same BuildTag as compatible
BuildTag = cvf-online-3

; --- Gameplay rules (must be identical for both players) ---
; Attacks can only be invincible during their first N frames (0 = original game)
MaxAttackInvincibility = 6
; Item crashes keep their full invincibility
InvincibilityExemptStates = 1000-1099
; MP is variable 34; every MP gain is multiplied by this (1.0 = original game)
MPVar = 34
MPGainScale = 0.5
; Frames after a special attack ends before another can start (60 = 1 second, 0 = off)
SpecialCooldown = 45
; States that count as special attacks (item crashes are 1000-1099, so they are left out)
SpecialStates = 1100-2999
; Only Castlevania Fighter's playable characters are affected (bosses are not)
RulesAuthor = CvF
