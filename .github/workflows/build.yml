name: Build CvF Online

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/**'
      - '.github/workflows/build.yml'
      - 'cvf-files/**'
      - 'ios/**'
      - 'tools/**'

env:
  IKEMEN_REPO: https://github.com/ikemen-engine/Ikemen-GO.git
  IKEMEN_COMMIT: 6a09392

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel build: on an Apple Silicon Mac it runs through Rosetta 2 and does
          # exactly the same floating-point math as Windows / Linux x86-64 players.
          - name: intel
            os: macos-15-intel
            target: MacOS
            bin: Ikemen_GO_MacOS
            app: "CvF Online (Intel - for online vs PC).app"
            goflags: ""
          # Native Apple Silicon build, FMA fusion disabled. Fine for Mac-vs-Mac/offline.
          - name: arm64
            os: macos-15
            target: MacOSARM
            bin: Ikemen_GO_MacOSARM
            app: "CvF Online (Apple Silicon).app"
            goflags: "-gcflags=all=-d=fmahash=n"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Ikemen GO and apply CvF rollback fixes
        run: |
          git clone "$IKEMEN_REPO" ikemen
          cd ikemen
          git checkout "$IKEMEN_COMMIT"
          git apply ../patches/ikemen-cvf-online.patch
          git --no-pager diff --stat

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: ikemen/go.sum

      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_AUTO_UPDATE=1
          brew install --quiet pkg-config git nasm libxmp sdl2 molten-vk

      - name: Build
        working-directory: ikemen
        env:
          BUILD_FFMPEG: "yes"
          BUILD_SDL2: "no"
          CGO_ENABLED: "1"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          GOFLAGS: ${{ matrix.goflags }}
        run: |
          go env -w GO111MODULE=on
          go mod download
          ./build/build.sh ${{ matrix.target }}
          make appbundle BINNAME=bin/${{ matrix.bin }}
          mv I.K.E.M.E.N-Go.app "../${{ matrix.app }}"
          file "../${{ matrix.app }}/Contents/MacOS/${{ matrix.bin }}"
          otool -L "../${{ matrix.app }}/Contents/MacOS/${{ matrix.bin }}" | head -30

      - name: Bundle Homebrew dylibs into the app
        run: |
          APP="${{ matrix.app }}"
          BIN="$APP/Contents/MacOS/${{ matrix.bin }}"
          FW="$APP/Contents/Frameworks"
          mkdir -p "$FW"
          # Copy any Homebrew-provided dylibs the binary links to, and point the binary at the bundled copies
          for lib in $(otool -L "$BIN" | awk '/\/(opt\/homebrew|usr\/local)\//{print $1}'); do
            base=$(basename "$lib")
            cp -Lf "$lib" "$FW/$base"
            chmod u+w "$FW/$base"
            install_name_tool -change "$lib" "@executable_path/../Frameworks/$base" "$BIN"
            install_name_tool -id "@executable_path/../Frameworks/$base" "$FW/$base" || true
          done
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$BIN" 2>/dev/null || true
          codesign --force --deep --sign - "$APP"
          otool -L "$BIN" | head -30

      - name: Package
        run: |
          ditto -c -k --keepParent "${{ matrix.app }}" "cvf-online-macos-${{ matrix.name }}.zip"
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cvf-online-macos-${{ matrix.name }}
          path: cvf-online-macos-${{ matrix.name }}.zip
          retention-days: 30

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Ikemen GO and apply CvF rollback fixes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git clone "$IKEMEN_REPO" ikemen
          cd ikemen
          git checkout "$IKEMEN_COMMIT"
          git apply ../patches/ikemen-cvf-online.patch
          git --no-pager diff --stat

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: ikemen/go.sum

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            make
            diffutils
            zip
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-tools
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libxmp

      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Build
        shell: 'msys2 {0}'
        working-directory: ikemen
        env:
          BUILD_FFMPEG: "yes"
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          go env -w GO111MODULE=on
          go mod download
          ./build/build.sh Win64
          ls -la Ikemen_GO.exe lib/

      - name: Package (engine + CvF port files, no game content)
        shell: 'msys2 {0}'
        run: |
          D=CvF-Online-Windows
          mkdir -p $D/lib $D/data $D/font $D/save
          cp ikemen/Ikemen_GO.exe $D/
          cp -r ikemen/lib/* $D/lib/
          cp -r ikemen/external $D/
          # Ikemen data files, minus the ones Castlevania Fighter ships its own versions of
          for f in ikemen/data/*; do
            case "$(basename "$f")" in
              common.snd|fight.def|fight.sff|fight.snd|fightfx.air|fightfx.sff) ;;
              *) cp -r "$f" $D/data/ ;;
            esac
          done
          cp ikemen/src/resources/defaultMotif.ini $D/data/system.base.def
          cp -rn ikemen/font/* $D/font/ 2>/dev/null || true
          # Runtime assets that Ikemen releases take from the Screenpack repo (gofx, glyphs, fonts...)
          git clone --depth 1 https://github.com/ikemen-engine/Ikemen-GO-Screenpack.git screenpack
          for f in screenpack/data/*; do
            case "$(basename "$f")" in
              common.snd|fight.def|fight.sff|fight.snd|fightfx.air|fightfx.sff) ;;
              *) cp -rn "$f" $D/data/ ;;
            esac
          done
          cp -rn screenpack/font/* $D/font/ 2>/dev/null || true
          curl -fsSL https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/refs/heads/master/gamecontrollerdb.txt -o $D/external/gamecontrollerdb.txt || true
          # Fail the build if anything the engine needs at startup is missing
          for need in data/gofx/gofx.def data/glyphs.sff data/system.base.def data/common.air data/common.cmd data/common.const data/action.zss; do
            test -e "$D/$need" || { echo "MISSING $need"; exit 1; }
          done
          cp cvf-files/data/characters.def cvf-files/data/options11.def cvf-files/data/cvf_online.ini $D/data/
          mkdir -p $D/chars && cp -r cvf-files/chars/* $D/chars/
          cp cvf-files/save/config.ini $D/save/
          cp cvf-files/README-ONLINE.txt cvf-files/INSTALL-WINDOWS.txt $D/
          mkdir -p $D/patches && cp patches/*.patch $D/patches/
          zip -q -r cvf-online-windows-x64.zip $D
          ls -la cvf-online-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cvf-online-windows-x64
          path: cvf-online-windows-x64.zip
          retention-days: 30

  # Every CPU must compute identical math for rollback netplay between
  # PC (Intel/AMD) and Mac/iPad (Apple chips).
  detmath-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Ikemen GO and apply CvF patch
        run: |
          git config --global core.autocrlf false
          git clone -q "$IKEMEN_REPO" ikemen
          cd ikemen && git checkout -q "$IKEMEN_COMMIT" && git apply ../patches/ikemen-cvf-online.patch
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Hash deterministic math results
        env:
          GOFLAGS: "-gcflags=all=-d=fmahash=n"
        run: |
          cp ikemen/src/cvf_detmath.go tools/detmath-check/detmath.go
          cd tools/detmath-check
          go build -o detmath-check . 2>/dev/null
          ./detmath-check | tee out.txt
          echo "$(go env GOARCH)"
          grep -q 'hash=11406f6a4a9e04e52db4ac2407cdcfed2dfce4a876dcb546a6bb00d1dc55a486' out.txt
      - name: Same check with TinyGo (compiler used for the PS Vita build)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.44.0/tinygo_0.44.0_amd64.deb
          sudo dpkg -i tinygo_0.44.0_amd64.deb
          cd tools/detmath-check
          tinygo run . | tee out-tinygo.txt
          grep -q 'hash=11406f6a4a9e04e52db4ac2407cdcfed2dfce4a876dcb546a6bb00d1dc55a486' out-tinygo.txt

  ios:
    # The ikemen-ios Xcode project needs Xcode 26 (default on macos-26).
    runs-on: macos-26
    env:
      IOS_APP_COMMIT: 60606d6
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Ikemen GO and apply CvF patch
        run: |
          git clone "$IKEMEN_REPO" ikemen
          cd ikemen
          git checkout "$IKEMEN_COMMIT"
          git apply ../patches/ikemen-cvf-online.patch
          git --no-pager diff --stat

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: ikemen/go.sum

      - name: Install host tools
        run: |
          export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_AUTO_UPDATE=1
          brew install --quiet pkg-config git nasm
          xcodebuild -version

      - name: Prepare the CvF Online iOS app project
        run: |
          git clone https://github.com/Jesuszilla/ikemen-ios.git CvF-Online-iOS
          git -C CvF-Online-iOS checkout "$IOS_APP_COMMIT"
          ./ios/customize.sh CvF-Online-iOS

      - name: Build engine + IPA
        working-directory: ikemen
        env:
          BUILD_FFMPEG: "yes"
          CGO_ENABLED: "1"
          GOFLAGS: "-gcflags=all=-d=fmahash=n"
          IOS_WRAPPER_DIR: ${{ github.workspace }}/CvF-Online-iOS
          IOS_APP_VERSION: "0.8.5"
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          go env -w GO111MODULE=on
          go mod download
          ./build/build.sh iOS 2> >(grep -v 'fmahash\|bisect-match' >&2)
          test -f bin/ikemen-go.ipa
          cp bin/ikemen-go.ipa "../cvf-online-ios.ipa"
          unzip -p bin/ikemen-go.ipa 'Payload/*.app/Info.plist' > /tmp/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleDisplayName' -c 'Print :MinimumOSVersion' -c 'Print :UIFileSharingEnabled' /tmp/Info.plist
          unzip -l bin/ikemen-go.ipa | tail -3

      - name: Package Xcode project (build + sign on your own device)
        run: |
          rm -rf CvF-Online-iOS/.git CvF-Online-iOS/DefaultAssets/external
          ditto -c -k --keepParent CvF-Online-iOS cvf-online-ios-xcode.zip
          ls -la cvf-online-ios.ipa cvf-online-ios-xcode.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cvf-online-ios
          path: |
            cvf-online-ios.ipa
            cvf-online-ios-xcode.zip
          retention-days: 30

