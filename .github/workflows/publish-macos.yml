name: Publish CvF Online (macOS)

on:
  workflow_run:
    workflows: ["Build CvF Online (macOS)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id to publish"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release delete cvf-online-macos --yes --cleanup-tag 2>/dev/null || true
          gh release create cvf-online-macos dist/*.zip \
            --title "CvF Online - macOS builds" \
            --notes "Patched Ikemen GO (rollback fixes) for Castlevania Fighter. Intel build = run through Rosetta for online play against Windows/Linux. Apple Silicon build = Mac-vs-Mac/offline." \
            --target main
