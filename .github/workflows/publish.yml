name: Publish CvF Online

on:
  workflow_run:
    workflows: ["Build CvF Online"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id to publish"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip builds that are older than main
        id: fresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "ok=true" >> $GITHUB_OUTPUT; exit 0; fi
          latest=$(gh api repos/${{ github.repository }}/commits/main -q .sha)
          if [ "$latest" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "Build is for ${{ github.event.workflow_run.head_sha }}, main is $latest - not publishing"
            echo "ok=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/download-artifact@v4
        if: steps.fresh.outputs.ok == 'true'
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
          merge-multiple: true
      - name: Publish release
        if: steps.fresh.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          for tag in cvf-online-macos cvf-online-windows; do
            n=$(ls dist | grep -c "$tag" || true)
            [ "$n" -gt 0 ] || continue
            case $tag in
              cvf-online-macos) title="CvF Online - macOS builds"; notes="Patched Ikemen GO (rollback fixes) for Castlevania Fighter. Intel build = run through Rosetta for online play against Windows/Linux. Apple Silicon build = Mac-vs-Mac/offline. Put the .app next to chars/, data/, stages/.";;
              cvf-online-windows) title="CvF Online - Windows x64 build"; notes="Patched Ikemen GO (rollback fixes) for Castlevania Fighter v0.8.5b, Windows 10/11 x64. Engine package only: copy chars, stages, data, font, sound from your Castlevania Fighter v0.8.5b folder into the extracted folder (skip files that already exist), then run Ikemen_GO.exe. In menus press Z / controller A to choose.";;
            esac
            gh release delete $tag --yes --cleanup-tag 2>/dev/null || true
            gh release create $tag dist/$tag*.zip --title "$title" --notes "$notes" --target main
          done
